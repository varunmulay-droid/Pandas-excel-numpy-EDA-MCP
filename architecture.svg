<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; rx: 10; }
      .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 11.5px; fill: #334155; }
      .label { font-size: 11px; fill: #64748b; font-style: italic; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#f8fafc"/>

  <!-- User -->
  <rect class="box" x="400" y="16" width="200" height="48" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="500" y="45" text-anchor="middle" class="title">User</text>

  <!-- Langflow -->
  <rect class="box" x="370" y="96" width="260" height="56" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="500" y="120" text-anchor="middle" class="title">Langflow</text>
  <text x="500" y="138" text-anchor="middle" class="sub">Orchestration + Agent reasoning</text>

  <!-- OpenRouter LLM -->
  <rect class="box" x="370" y="184" width="260" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="500" y="208" text-anchor="middle" class="title">OpenRouter LLM</text>
  <text x="500" y="226" text-anchor="middle" class="sub">Base LLM Agent (LLM provider)</text>

  <!-- MCP Client -->
  <rect class="box" x="370" y="272" width="260" height="56" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="500" y="296" text-anchor="middle" class="title">MCP Client</text>
  <text x="500" y="314" text-anchor="middle" class="sub">Tool Mode / Toolset wiring</text>

  <!-- HTTPS label -->
  <text x="500" y="345" text-anchor="middle" class="label">HTTPS · Streamable HTTP · Bearer auth</text>

  <!-- Render MCP Server -->
  <rect class="box" x="330" y="356" width="340" height="64" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="500" y="382" text-anchor="middle" class="title">Render — Pandas Excel Analytics MCP</text>
  <text x="500" y="400" text-anchor="middle" class="sub">FastMCP / MCPServer · Streamable HTTP · /mcp · /health</text>

  <!-- Dataset Manager -->
  <rect class="box" x="380" y="452" width="240" height="52" fill="#fef9c3" stroke="#eab308"/>
  <text x="500" y="474" text-anchor="middle" class="title" font-size="14">Dataset Manager</text>
  <text x="500" y="491" text-anchor="middle" class="sub">dataset_id · session · validation</text>

  <!-- Engines row -->
  <rect class="box" x="90"  y="536" width="180" height="56" fill="#ffedd5" stroke="#f97316"/>
  <text x="180" y="560" text-anchor="middle" class="title" font-size="14">Pandas Engine</text>
  <text x="180" y="578" text-anchor="middle" class="sub">filter · group · pivot</text>

  <rect class="box" x="290" y="536" width="180" height="56" fill="#ffedd5" stroke="#f97316"/>
  <text x="380" y="560" text-anchor="middle" class="title" font-size="14">NumPy Engine</text>
  <text x="380" y="578" text-anchor="middle" class="sub">stats · correlation · outliers</text>

  <rect class="box" x="490" y="536" width="180" height="56" fill="#ffedd5" stroke="#f97316"/>
  <text x="580" y="560" text-anchor="middle" class="title" font-size="14">Excel Engine</text>
  <text x="580" y="578" text-anchor="middle" class="sub">openpyxl · format · charts</text>

  <rect class="box" x="690" y="536" width="180" height="56" fill="#ffedd5" stroke="#f97316"/>
  <text x="780" y="560" text-anchor="middle" class="title" font-size="14">Cleaning Engine</text>
  <text x="780" y="578" text-anchor="middle" class="sub">dedupe · fill · convert</text>

  <!-- EDA Engine -->
  <rect class="box" x="380" y="624" width="240" height="52" fill="#fee2e2" stroke="#ef4444"/>
  <text x="500" y="646" text-anchor="middle" class="title" font-size="14">EDA Engine</text>
  <text x="500" y="663" text-anchor="middle" class="sub">profiling · data-quality score</text>

  <!-- Export row -->
  <rect class="box" x="230" y="706" width="140" height="44" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="300" y="733" text-anchor="middle" class="sub" font-weight="700">CSV</text>

  <rect class="box" x="430" y="706" width="140" height="44" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="500" y="733" text-anchor="middle" class="sub" font-weight="700">XLSX</text>

  <rect class="box" x="630" y="706" width="140" height="44" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="700" y="733" text-anchor="middle" class="sub" font-weight="700">JSON</text>

  <!-- Arrows -->
  <path class="edge" d="M500,64 L500,94"/>
  <path class="edge" d="M500,152 L500,182"/>
  <path class="edge" d="M500,240 L500,270"/>
  <path class="edge" d="M500,328 L500,354"/>
  <path class="edge" d="M500,420 L500,450"/>

  <path class="edge" d="M470,504 C300,516 200,520 180,534"/>
  <path class="edge" d="M485,504 C420,516 390,520 380,534"/>
  <path class="edge" d="M515,504 C550,516 570,520 580,534"/>
  <path class="edge" d="M530,504 C660,516 750,520 780,534"/>

  <path class="edge" d="M180,592 C260,610 400,618 460,626"/>
  <path class="edge" d="M380,592 L470,626"/>
  <path class="edge" d="M580,592 L540,626"/>
  <path class="edge" d="M780,592 C700,610 560,618 540,626"/>

  <path class="edge" d="M460,676 C380,690 320,696 300,704"/>
  <path class="edge" d="M500,676 L500,704"/>
  <path class="edge" d="M540,676 C620,690 680,696 700,704"/>
</svg>
