services:
  - type: web
    name: pandas-excel-analytics-mcp
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MCP_API_TOKEN
        generateValue: true
      - key: MCP_ALLOWED_HOSTS
        value: pandas-excel-analytics-mcp.onrender.com
      - key: MCP_MAX_FILE_SIZE_MB
        value: "50"
      - key: MCP_MAX_ROWS
        value: "1000000"
      - key: MCP_MAX_COLUMNS
        value: "500"
      - key: PYTHON_VERSION
        value: "3.12.3"
