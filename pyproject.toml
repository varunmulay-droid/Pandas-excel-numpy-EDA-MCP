[project]
name = "pandas-excel-analytics-mcp"
version = "1.0.0"
description = "Deterministic MCP server exposing Pandas, NumPy, Excel/openpyxl, and EDA tools over uploaded tabular datasets."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "python-dateutil>=2.9.0",
    "pydantic>=2.6.0,<3.0.0",
    "uvicorn[standard]>=0.29.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
